server {
    listen 80;
    server_name api.yourdomain.com;  # Replace with your domain or EC2 IP

    # Redirect HTTP to HTTPS (uncomment after certbot setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for potential future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running pipeline requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
