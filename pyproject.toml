[project]
name = "yt-chatter"
version = "0.1.0"
description = "Search engine for financial market commentary from YouTube"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # LLM
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    # YouTube
    "youtube-transcript-api>=0.6.0",
    "google-api-python-client>=2.150.0",
    "yt-dlp>=2024.12.0",
    # Market data
    "yfinance>=0.2.40",
    "fredapi>=0.5.0",
    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
